name: Public CI (Build, Packaging & Docs Examples)

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-typecheck:
    name: Build & Typecheck (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build all 20 packages
        run: npm run build
      - name: Strict TypeScript check
        run: npm run typecheck

  packaging-and-docs:
    name: Packaging Tarballs & Docs Examples (Node 22 + Bun 1.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build all 20 packages
        run: npm run build
      - name: Verify 20-package npm pack tarballs & consumer ESM imports
        run: npm run packages:verify
      - name: Verify executable documentation examples (Node 22 & Bun 1.4)
        run: npm run docs:verify
      - name: Verify benchmark modules load cleanly
        run: node --input-type=module -e "import './benchmarks/lib/apps.mjs'; import './benchmarks/suites/microbenchmarks.mjs'; console.log('Benchmarks verified');"
