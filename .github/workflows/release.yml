name: Publish Release to npm (OIDC Provenance)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (e.g. latest, next)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - next
      dry_run:
        description: 'Run full verification and npm publish --dry-run without mutating npm registry'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  verify-and-publish:
    name: Verify & Publish 21 @forge-fr/* Packages to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js 22 (with npm registry OIDC)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@forge-fr'

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build all 21 packages
        run: npm run build

      - name: Validate workspace metadata, scope & version consistency
        run: npm run packages:validate

      - name: Strict TypeScript typecheck
        run: npm run typecheck

      - name: Security dependency audit (blocking high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify documentation examples on Node.js & Bun
        run: npm run docs:verify

      - name: Verify 21-package npm pack hygiene & isolated external consumer installs
        run: npm run packages:verify

      - name: Publish packages in topological dependency order to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DIST_TAG:-}" ]; then
            DIST_TAG="$INPUT_DIST_TAG"
          elif [[ "$REF_NAME" == *"-"* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi

          DRY_FLAG=""
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          PACKAGES=(
            core
            config
            router
            http
            testing
            node
            bun
            edge
            validation
            database
            drizzle
            prisma
            auth
            authorization
            security
            logger
            cache
            queue
            storage
            openapi
            cli
          )

          for pkg in "${PACKAGES[@]}"; do
            echo "Publishing @forge-fr/${pkg} (tag: ${DIST_TAG} ${DRY_FLAG})..."
            npm publish "./packages/${pkg}" --provenance --access public --tag "${DIST_TAG}" ${DRY_FLAG}
          done

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --title "ForgeJS ${GITHUB_REF_NAME}"
